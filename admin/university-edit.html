<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>កែប្រែព័ត៌មានសាកលវិទ្យាល័យ - NEXT STEP Admin</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar" id="adminSidebar">
    <a href="dashboard.html" class="admin-sidebar-brand">
      <div class="brand-icon-box" style="width: 32px; height: 32px; font-size: 1rem;"><i class="bi bi-shield-lock-fill"></i></div>
      <div>
        <div class="lh-1">NEXT STEP</div>
        <small class="text-muted fw-normal" style="font-size: 0.7rem;">Admin Panel</small>
      </div>
    </a>
    <div class="admin-nav">
      <div class="admin-nav-item"><a href="dashboard.html" class="admin-nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></div>
      <div class="admin-nav-item"><a href="universities.html" class="admin-nav-link active"><i class="bi bi-buildings"></i><span>សាកលវិទ្យាល័យ</span></a></div>
      <div class="admin-nav-item"><a href="majors.html" class="admin-nav-link"><i class="bi bi-mortarboard"></i><span>មុខជំនាញ</span></a></div>
      <div class="admin-nav-item"><a href="scholarships.html" class="admin-nav-link"><i class="bi bi-gift"></i><span>អាហារូបករណ៍</span></a></div>
      <div class="admin-nav-item"><a href="users.html" class="admin-nav-link"><i class="bi bi-people"></i><span>អ្នកប្រើប្រាស់</span></a></div>
      <div class="admin-nav-item"><a href="news.html" class="admin-nav-link"><i class="bi bi-newspaper"></i><span>ព័ត៌មាន</span></a></div>
      <div class="admin-nav-item"><a href="categories.html" class="admin-nav-link"><i class="bi bi-tags"></i><span>ជំពូកមុខវិជ្ជា</span></a></div>
      <div class="admin-nav-item"><a href="content.html" class="admin-nav-link"><i class="bi bi-layout-text-window-reverse"></i><span>មាតិកាទំព័រដើម</span></a></div>
      <div class="admin-nav-item border-top border-secondary my-2 pt-2"><a href="profile.html" class="admin-nav-link"><i class="bi bi-person-gear"></i><span>Admin Profile</span></a></div>
      <div class="admin-nav-item"><a href="settings.html" class="admin-nav-link"><i class="bi bi-gear"></i><span>ការកំណត់</span></a></div>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light d-lg-none" id="adminSidebarToggle"><i class="bi bi-list fs-5"></i></button>
        <div class="fw-semibold text-dark fs-5">កែប្រែព័ត៌មានសាកលវិទ្យាល័យ (Edit University)</div>
      </div>
      <div>
        <a href="universities.html" class="btn btn-sm btn-outline-secondary">&larr; ត្រឡប់ក្រោយ</a>
      </div>
    </header>

    <main class="admin-content">
      <div class="card ns-card shadow-sm p-4 max-w-4xl mx-auto bg-white">
        <form id="university-form">
          <input type="hidden" id="uni-id" value="">
          
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">ឈ្មោះជាភាសាខ្មែរ *</label>
              <input type="text" id="uni-name-kh" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">ឈ្មោះជាភាសាអង់គ្លេស *</label>
              <input type="text" id="uni-name-en" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">ប្រភេទគ្រឹះស្ថាន *</label>
              <select id="uni-type" class="form-select" required>
                <option value="Public">រដ្ឋ (Public)</option>
                <option value="Private">ឯកជន (Private)</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">ទីតាំង (ខេត្ត/រាជធានី) *</label>
              <input type="text" id="uni-location" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">តម្លៃសិក្សាប្រចាំឆ្នាំ *</label>
              <input type="text" id="uni-tuition" class="form-control" required>
            </div>
            <div class="col-12">
              <label class="form-label small fw-semibold">អាសយដ្ឋានលម្អិត</label>
              <input type="text" id="uni-address" class="form-control">
            </div>
          </div>

          <h6 class="fw-bold mb-3 border-bottom pb-2">ព័ត៌មានទំនាក់ទំនង</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-3">
              <label class="form-label small fw-semibold">លេខទូរស័ព្ទ</label>
              <input type="tel" id="uni-phone" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">អ៊ីមែល</label>
              <input type="email" id="uni-email" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">គេហទំព័រ (Website)</label>
              <input type="url" id="uni-website" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">ហ្វេសប៊ុក (Facebook)</label>
              <input type="url" id="uni-facebook" class="form-control">
            </div>
          </div>

          <h6 class="fw-bold mb-3 border-bottom pb-2">ការពិពណ៌នា & បេសកកម្ម</h6>
          <div class="row g-3 mb-4">
            <div class="col-12">
              <label class="form-label small fw-semibold">អំពីសាកលវិទ្យាល័យ</label>
              <textarea id="uni-description" rows="3" class="form-control"></textarea>
            </div>
            <div class="col-12">
              <label class="form-label small fw-semibold">បេសកកម្ម</label>
              <textarea id="uni-mission" rows="2" class="form-control"></textarea>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 border-top pt-3">
            <a href="universities.html" class="btn btn-light">បោះបង់ (Cancel)</a>
            <button type="submit" class="btn btn-ns-primary px-4">
              <i class="bi bi-save me-1"></i> រក្សាទុកការកែប្រែ (Save Changes)
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAdminAuth();
      initAdminUniversityForm(true);
    });
  </script>
</body>
</html>

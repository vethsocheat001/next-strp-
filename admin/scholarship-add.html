<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>បន្ថែមអាហារូបករណ៍ថ្មី - NEXT STEP Admin</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar" id="adminSidebar">
    <a href="dashboard.html" class="admin-sidebar-brand">
      <div class="brand-icon-box" style="width: 32px; height: 32px; font-size: 1rem;"><i class="bi bi-shield-lock-fill"></i></div>
      <div>
        <div class="lh-1">NEXT STEP</div>
        <small class="text-muted fw-normal" style="font-size: 0.7rem;">Admin Panel</small>
      </div>
    </a>
    <div class="admin-nav">
      <div class="admin-nav-item"><a href="dashboard.html" class="admin-nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></div>
      <div class="admin-nav-item"><a href="universities.html" class="admin-nav-link"><i class="bi bi-buildings"></i><span>សាកលវិទ្យាល័យ</span></a></div>
      <div class="admin-nav-item"><a href="majors.html" class="admin-nav-link"><i class="bi bi-mortarboard"></i><span>មុខជំនាញ</span></a></div>
      <div class="admin-nav-item"><a href="scholarships.html" class="admin-nav-link active"><i class="bi bi-gift"></i><span>អាហារូបករណ៍</span></a></div>
      <div class="admin-nav-item"><a href="users.html" class="admin-nav-link"><i class="bi bi-people"></i><span>អ្នកប្រើប្រាស់</span></a></div>
      <div class="admin-nav-item"><a href="news.html" class="admin-nav-link"><i class="bi bi-newspaper"></i><span>ព័ត៌មាន</span></a></div>
      <div class="admin-nav-item"><a href="categories.html" class="admin-nav-link"><i class="bi bi-tags"></i><span>ជំពូកមុខវិជ្ជា</span></a></div>
      <div class="admin-nav-item"><a href="content.html" class="admin-nav-link"><i class="bi bi-layout-text-window-reverse"></i><span>មាតិកាទំព័រដើម</span></a></div>
      <div class="admin-nav-item border-top border-secondary my-2 pt-2"><a href="profile.html" class="admin-nav-link"><i class="bi bi-person-gear"></i><span>Admin Profile</span></a></div>
      <div class="admin-nav-item"><a href="settings.html" class="admin-nav-link"><i class="bi bi-gear"></i><span>ការកំណត់</span></a></div>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light d-lg-none" id="adminSidebarToggle"><i class="bi bi-list fs-5"></i></button>
        <div class="fw-semibold text-dark fs-5">បន្ថែមអាហារូបករណ៍ថ្មី (Add Scholarship)</div>
      </div>
      <div>
        <a href="scholarships.html" class="btn btn-sm btn-outline-secondary">&larr; ត្រឡប់ក្រោយ</a>
      </div>
    </header>

    <main class="admin-content">
      <div class="card ns-card shadow-sm p-4 max-w-4xl mx-auto bg-white">
        <form id="scholarship-form">
          <input type="hidden" id="sch-id" value="">

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">ឈ្មោះអាហារូបករណ៍ (ភាសាខ្មែរ) *</label>
              <input type="text" id="sch-name-kh" class="form-control" placeholder="ឧ. អាហារូបករណ៍រដ្ឋាភិបាលកម្ពុជា MoEYS" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">ឈ្មោះជាភាសាអង់គ្លេស *</label>
              <input type="text" id="sch-name-en" class="form-control" placeholder="ឧ. MoEYS Government Scholarship" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">សាកលវិទ្យាល័យ ឬស្ថាប័នផ្តល់ *</label>
              <input type="text" id="sch-university" class="form-control" placeholder="ឧ. ក្រសួងអប់រំ យុវជន និងកីឡា" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">កម្រិតសិក្សា (Degree) *</label>
              <select id="sch-degree" class="form-select" required>
                <option value="Bachelor">បរិញ្ញាបត្រ (Bachelor)</option>
                <option value="Master">អនុបណ្ឌិត (Master)</option>
                <option value="PhD">បណ្ឌិត (PhD)</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">ស្ថានភាព (Status) *</label>
              <select id="sch-status" class="form-select" required>
                <option value="Open">Open (បើកទទួលពាក្យ)</option>
                <option value="Closing Soon">Closing Soon (ជិតផុតកំណត់)</option>
                <option value="Closed">Closed (បានបិទ)</option>
              </select>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-12">
              <label class="form-label small fw-semibold">អត្ថប្រយោជន៍អាហារូបករណ៍ (Benefits) *</label>
              <input type="text" id="sch-benefits" class="form-control" placeholder="ឧ. ឧបត្ថម្ភថ្លៃសិក្សា ១០០% រយៈពេល ៤ ឆ្នាំពេញ" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">ថ្ងៃចាប់ផ្តើមទទួលពាក្យ</label>
              <input type="date" id="sch-start-date" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">កាលបរិច្ឆេទផុតកំណត់ (Deadline) *</label>
              <input type="date" id="sch-deadline" class="form-control" required>
            </div>
            <div class="col-12">
              <label class="form-label small fw-semibold">តំណភ្ជាប់ដាក់ពាក្យផ្លូវការ (URL)</label>
              <input type="url" id="sch-url" class="form-control" placeholder="https://...">
            </div>
            <div class="col-12">
              <label class="form-label small fw-semibold">ព័ត៌មានលម្អិត & លក្ខខណ្ឌ</label>
              <textarea id="sch-desc" rows="4" class="form-control" placeholder="សេចក្តីពិពណ៌នាអំពីអាហារូបករណ៍..."></textarea>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 border-top pt-3">
            <a href="scholarships.html" class="btn btn-light">បោះបង់ (Cancel)</a>
            <button type="submit" class="btn btn-ns-primary px-4">
              <i class="bi bi-save me-1"></i> រក្សាទុក (Save)
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAdminAuth();
      initAdminScholarshipForm(false);
    });
  </script>
</body>
</html>

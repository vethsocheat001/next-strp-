<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>កែប្រែមុខជំនាញ - NEXT STEP Admin</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar" id="adminSidebar">
    <a href="dashboard.html" class="admin-sidebar-brand">
      <div class="brand-icon-box" style="width: 32px; height: 32px; font-size: 1rem;"><i class="bi bi-shield-lock-fill"></i></div>
      <div>
        <div class="lh-1">NEXT STEP</div>
        <small class="text-muted fw-normal" style="font-size: 0.7rem;">Admin Panel</small>
      </div>
    </a>
    <div class="admin-nav">
      <div class="admin-nav-item"><a href="dashboard.html" class="admin-nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></div>
      <div class="admin-nav-item"><a href="universities.html" class="admin-nav-link"><i class="bi bi-buildings"></i><span>សាកលវិទ្យាល័យ</span></a></div>
      <div class="admin-nav-item"><a href="majors.html" class="admin-nav-link active"><i class="bi bi-mortarboard"></i><span>មុខជំនាញ</span></a></div>
      <div class="admin-nav-item"><a href="scholarships.html" class="admin-nav-link"><i class="bi bi-gift"></i><span>អាហារូបករណ៍</span></a></div>
      <div class="admin-nav-item"><a href="users.html" class="admin-nav-link"><i class="bi bi-people"></i><span>អ្នកប្រើប្រាស់</span></a></div>
      <div class="admin-nav-item"><a href="news.html" class="admin-nav-link"><i class="bi bi-newspaper"></i><span>ព័ត៌មាន</span></a></div>
      <div class="admin-nav-item"><a href="categories.html" class="admin-nav-link"><i class="bi bi-tags"></i><span>ជំពូកមុខវិជ្ជា</span></a></div>
      <div class="admin-nav-item"><a href="content.html" class="admin-nav-link"><i class="bi bi-layout-text-window-reverse"></i><span>មាតិកាទំព័រដើម</span></a></div>
      <div class="admin-nav-item border-top border-secondary my-2 pt-2"><a href="profile.html" class="admin-nav-link"><i class="bi bi-person-gear"></i><span>Admin Profile</span></a></div>
      <div class="admin-nav-item"><a href="settings.html" class="admin-nav-link"><i class="bi bi-gear"></i><span>ការកំណត់</span></a></div>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light d-lg-none" id="adminSidebarToggle"><i class="bi bi-list fs-5"></i></button>
        <div class="fw-semibold text-dark fs-5">កែប្រែមុខជំនាញ (Edit Major)</div>
      </div>
      <div>
        <a href="majors.html" class="btn btn-sm btn-outline-secondary">&larr; ត្រឡប់ក្រោយ</a>
      </div>
    </header>

    <main class="admin-content">
      <div class="card ns-card shadow-sm p-4 max-w-4xl mx-auto bg-white">
        <form id="major-form">
          <input type="hidden" id="major-id" value="">

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">ឈ្មោះជំនាញជាភាសាខ្មែរ *</label>
              <input type="text" id="major-name-kh" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">ឈ្មោះជាភាសាអង់គ្លេស *</label>
              <input type="text" id="major-name-en" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">ជំពូក (Category) *</label>
              <select id="major-category" class="form-select" required>
                <option value="Computer & Technology">Computer & Technology</option>
                <option value="Engineering & Architecture">Engineering & Architecture</option>
                <option value="Business & Economics">Business & Economics</option>
                <option value="Health Science">Health Science</option>
                <option value="Social Science & Humanities">Social Science & Humanities</option>
                <option value="Agriculture">Agriculture</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">រយៈពេលសិក្សា *</label>
              <input type="text" id="major-duration" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">សញ្ញាបត្រទទួលបាន</label>
              <input type="text" id="major-degree" class="form-control">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold">ការពិពណ៌នាអំពីមុខជំនាញ *</label>
            <textarea id="major-desc" rows="3" class="form-control" required></textarea>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">ប្រាក់ខែប៉ាន់ស្មានដំបូង</label>
              <input type="text" id="major-salary" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">ជំនាញចាំបាច់ (បំបែកដោយក្បៀស ,)</label>
              <input type="text" id="major-skills" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label small fw-semibold">សិស្សដែលស័ក្តិសមជាមួយជំនាញនេះ</label>
              <textarea id="major-suitable" rows="2" class="form-control"></textarea>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 border-top pt-3">
            <a href="majors.html" class="btn btn-light">បោះបង់ (Cancel)</a>
            <button type="submit" class="btn btn-ns-primary px-4">
              <i class="bi bi-save me-1"></i> រក្សាទុកការកែប្រែ (Save Changes)
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAdminAuth();
      initAdminMajorForm(true);
    });
  </script>
</body>
</html>
